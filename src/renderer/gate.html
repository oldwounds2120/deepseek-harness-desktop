<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --text: #1f2329;
      --muted: #8a919c;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap { text-align: center; max-width: 420px; padding: 32px; }
    .spinner {
      width: 36px; height: 36px;
      margin: 0 auto 18px;
      border: 3px solid #e3e6eb;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { width: 10px; height: 10px; margin: 0 auto 18px; border-radius: 50%; background: #d64545; }
    h1 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
    p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .err { color: #d64545; }
    button {
      margin-top: 18px;
      border: 1px solid #e3e6eb;
      background: #fff;
      color: var(--text);
      padding: 7px 22px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="state">
      <div class="spinner"></div>
      <h1>dsh 启动中…</h1>
      <p>正在准备 DeepSeek Harness 服务</p>
    </div>
  </div>
  <script>
    (function () {
      var state = document.getElementById('state')
      var mounted = true

      function render(s) {
        if (!mounted) return
        if (s && s.url) {
          // 主进程会负责跳转，这里兜底
          window.location.replace(s.url)
          return
        }
        if (s && s.state === 'error') {
          state.innerHTML =
            '<div class="dot"></div>' +
            '<h1 class="err">dsh 服务异常</h1>' +
            '<p>' + escapeHtml(s.error || '未知错误，请查看日志') + '</p>' +
            '<button onclick="window.dshDesktop.dshRestart()">重试</button>'
          return
        }
        state.innerHTML =
          '<div class="spinner"></div>' +
          '<h1>dsh 启动中…</h1>' +
          '<p>正在准备 DeepSeek Harness 服务</p>'
      }

      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        })
      }

      if (window.dshDesktop) {
        window.dshDesktop.onDshStatus(render)
        window.dshDesktop.dshStatus().then(render)
      } else {
        state.innerHTML = '<h1 class="err">桥接未就绪</h1><p>请重新启动应用</p>'
      }
    })()
  </script>
</body>
</html>
